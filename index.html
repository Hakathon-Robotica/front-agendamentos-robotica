<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="Sistema de Gestão de Competições de Robótica Escolar">
    <title>Robótica Escolar · Gestão</title>
    <link rel="stylesheet" href="./src/styles/main.css">
    <link id="competitions-styles" rel="stylesheet" href="./src/styles/competitions.css">
    <link rel="stylesheet" href="./src/styles/registrations.css">
    <link rel="stylesheet" href="./src/styles/palette.css">
    <link rel="stylesheet" href="./src/styles/projects.css">
    <link rel="stylesheet" href="./src/styles/responsive.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <section id="login-screen" class="login-screen" aria-label="Acesso ao sistema" hidden></section>
      <div id="admin-screen" class="admin-shell" hidden>
        <aside id="sidebar" class="sidebar"></aside>
        <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Fechar navegação" hidden></button>
        <div class="workspace">
          <header id="topbar" class="topbar"></header>
          <main id="main-content" class="main-content" tabindex="-1"></main>
        </div>
      </div>
      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
